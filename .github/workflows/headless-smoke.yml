name: headless-smoke

on:
  push:
    branches: [ main, master, 'codex/**' ]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Asset smoke fallback
        run: python3 tools/run_asset_smoke.py
      - name: Release guard
        run: python3 tools/release_guard.py
