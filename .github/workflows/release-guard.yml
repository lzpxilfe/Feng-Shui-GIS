name: release-guard

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Product release guard
        run: python3 tools/release_guard.py
